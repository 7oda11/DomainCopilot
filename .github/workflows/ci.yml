name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Build Angular workspace
        run: npm run build --prefix web

  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Restore
        run: dotnet restore DomainCopilot.slnx
      - name: Build
        run: dotnet build DomainCopilot.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test DomainCopilot.slnx --no-build --configuration Release --logger "trx;LogFileName=tests.trx"
      - name: Dependency vulnerability audit
        run: dotnet list DomainCopilot.slnx package --vulnerable --include-transitive
